[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-system"
version = "0.1.0"
description = "Modular trading system with risk management"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "polars>=0.20",
    "duckdb>=0.9",
    "sqlalchemy>=2.0",
    "structlog>=24.0",
    "typer>=0.9",
]

[project.scripts]
ts = "trading_system.cli:app"

[project.optional-dependencies]
# streamlit lives here, not in the core dependencies: the UI is the last thing
# built, and installing it drags pandas into every environment.
ui = [
    "streamlit>=1.28",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "jsonschema>=4.18",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Lint coverage must not depend on VCS ignore rules. A broad .gitignore entry
# (a bare "data/" once matched src/trading_system/data/) would otherwise remove
# whole packages from linting silently. Ruff's default excludes still skip
# venv/, build/ and the caches.
respect-gitignore = false

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "ARG",  # unused arguments
    "D",    # pydocstyle
    "TID",  # tidy imports
]
ignore = [
    "D203",  # conflicts with D211 (no blank line before class docstring)
    "D213",  # conflicts with D212 (summary on first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# typer's entire API is declaring options as argument defaults; B008 misreads it.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# Test modules, classes and cases are self-describing; names carry the intent.
"tests/**" = ["D100", "D101", "D102", "D103"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# Benchmarks are deselected by default: building a million-bar frame takes
# longer than the rest of the suite takes to run. `make bench` opts back in.
addopts = "--strict-markers --strict-config -m 'not benchmark'"
markers = [
    "benchmark: performance budget on million-bar frames; run with `-m benchmark`",
]
