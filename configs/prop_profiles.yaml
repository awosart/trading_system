# Prop-firm account profiles: leverage per asset class, and any firm-level cap
# on total exposure.
#
# ---------------------------------------------------------------------------
# SOURCE, AND WHY YOU MUST CHECK IT YOURSELF
#
# Two independent readings went into this file and they disagreed with each
# other. One was a set of figures carried from secondary reviews; the other was
# the comparison table at wladislav.com, an affiliate site. Neither is a firm's
# own rulebook. The disagreement was not cosmetic — FTMO metals read as 1:30 in
# one and 1:50 in the other, The5ers forex as 1:30 in one and 1:100 in the
# other, a factor of over three on the margin a gold position locks up.
#
# So: every number below is SECONDARY, of UNKNOWN DATE, and is what a backtest
# assumes rather than what a firm currently enforces. Before any of this is used
# to size a real position, reconcile it against the firm's own published rules.
# The `source` field on each profile says which reading it came from; it is not
# a claim that the reading was verified.
# ---------------------------------------------------------------------------
#
# `leverage` is written the way firms publish it: 30.0 means 1:30, which the
# code turns into a margin rate of 1/30. Only asset classes the firm publishes
# are listed — a class absent here keeps the broker rate already declared in
# instruments.yaml, because that file is the authority on what an instrument is
# and a profile is an amendment to it, not a replacement.
#
# `leverage_cap` is a DIFFERENT rule: a ceiling on total notional as a multiple
# of equity, enforced by the firm rather than by margin arithmetic. It is
# mandatory on every profile and must be written out even when it is `null`, so
# that "the firm publishes no such rule" cannot be confused with "nobody looked".
#
# Metals and energy both map to COMMODITY, which is one class in
# core/instruments.py. Where a firm publishes different figures for the two
# (The5ers: metals 1:33, energy 1:5) the METALS figure is recorded, because
# every commodity in instruments.yaml is a metal — XAUUSD and XAGUSD. Adding an
# energy instrument to the registry forces this choice to be made properly
# rather than inherited.
#
# The two metals do not force it. ESMA separates them (gold 1:20, silver 1:10)
# and instruments.yaml carries that per symbol, but no firm in this file
# publishes gold and silver apart — FTMO writes them as one row, and its
# Feb/May 2026 updates moved both to the same figure. A class holding one
# number is therefore enough for the profile layer. What would force a split is
# a firm quoting the two metals differently.
#
# ---------------------------------------------------------------------------
# `source_verified_date`, WRITTEN AS A COMMENT ABOVE EACH PROFILE
#
# Each profile below carries a `source_verified_date:` comment line stating the
# date its figures were last reconciled against the firm's OWN published rules,
# and which classes that reconciliation actually covered. "never" is a legal and
# common value here, and it is the honest one for most of this file.
#
# It is a comment rather than a field for two reasons. `PropProfile` is
# `extra="forbid"`, so a real key fails to load. And a real field would enter
# the profile's digest, therefore the `risk` component, therefore `run_id` —
# recording when somebody last read a website would invalidate every stored run.
# A comment is digest-neutral; this was checked, not assumed.
#
# What the date does NOT say: that the figures were correct for the period a
# backtest covers. A profile models one snapshot of a firm's rules and applies
# it to the whole history. See docs/data_schema.md, "PropProfile моделирует
# правила фирмы на дату сверки".
# ---------------------------------------------------------------------------

source: >-
  Secondary readings, unverified: a comparison table at wladislav.com (an
  affiliate site, undated) cross-checked against figures carried from secondary
  reviews. Reconcile against each firm's own rules before live use.

profiles:
  # Swing accounts are the ones that may hold through the weekend, which is
  # what every strategy in this repository does. The default for that reason,
  # and it is also the strictest complete profile here — a default that errs
  # towards refusing.
  # source_verified_date: 2026-08-10 — COMMODITY ONLY.
  #   FTMO leverage on metals, Swing, is 1:15. Confirmed against FTMO's own
  #   trading updates, which publish before/after tables: 2 Feb 2026 moved the
  #   XAU pairs from 1:9 to 1:15, 7 May 2026 moved the XAG pairs the same way.
  #   Both dates are cited because one figure covers two metals and they were
  #   moved three months apart. Recorded here as 30.0 until 2026-08-10, which
  #   FTMO has never published for Swing metals and which understated required
  #   margin by 2x.
  #   FX / INDEX / CRYPTO: never checked against a primary source.
  - name: ftmo_swing
    source: >-
      COMMODITY from FTMO's own trading updates of 2 Feb 2026 and 7 May 2026;
      FX, INDEX and CRYPTO still from the wladislav.com comparison table,
      FTMO "Swing" row
    leverage:
      FX: 30.0
      INDEX: 30.0
      COMMODITY: 15.0        # 1:15 since 1 Feb 2026 (gold), 11 May 2026 (silver); 1:9 before
      CRYPTO: 2.0
    leverage_cap: null
    notes: >-
      FTMO's swing plan. Lower leverage than the standard plan in exchange for
      being allowed to hold over the weekend and through news.

  # source_verified_date: 2026-08-10 — COMMODITY ONLY, same two FTMO trading
  #   updates. The figure below agrees with the firm's CURRENT rules (1:50 on
  #   both metals) but only became correct on 1 Feb 2026 for gold and
  #   11 May 2026 for silver; before those dates FTMO published 1:30. Any
  #   backtest whose history predates them is applying today's rule backwards.
  #   FX / INDEX / CRYPTO: never checked against a primary source.
  - name: ftmo_standard
    source: >-
      COMMODITY from FTMO's own trading updates of 2 Feb 2026 and 7 May 2026;
      FX, INDEX and CRYPTO still from the wladislav.com comparison table,
      FTMO "Standard" row
    leverage:
      FX: 100.0
      INDEX: 50.0
      COMMODITY: 50.0        # 1:50 since 1 Feb 2026 (gold), 11 May 2026 (silver); 1:30 before
      CRYPTO: 2.0
    leverage_cap: null
    notes: >-
      Standard plan. Does not permit holding positions over the weekend, so it
      does not apply to any strategy currently in this repository.

  # source_verified_date: never — no figure below has been read from The5ers'
  #   own rulebook. A 2026-08-10 search found only affiliate summaries, the same
  #   class of source the header already distrusts.
  - name: the5ers
    source: wladislav.com comparison table, The5ers row
    leverage:
      FX: 100.0
      INDEX: 25.0
      COMMODITY: 33.0        # metals; the same row publishes energy at 1:5
      CRYPTO: 2.0
    leverage_cap: null

  # source_verified_date: never — not read from FundedNext's own rulebook. A
  #   2026-08-10 search surfaced a secondary "commodities 1:25" figure agreeing
  #   with the line below, which is corroboration from an equally weak source,
  #   not verification.
  - name: fundednext
    source: wladislav.com comparison table, FundedNext row
    leverage:
      FX: 100.0
      INDEX: 15.0
      COMMODITY: 25.0        # metals; energy published at 1:25 as well
      CRYPTO: 1.0
    leverage_cap: null

  # source_verified_date: never — not read from Brightfunded's own rulebook.
  - name: brightfunded
    source: wladislav.com comparison table, Brightfunded row
    leverage:
      FX: 100.0
      INDEX: 20.0
      COMMODITY: 40.0
      CRYPTO: 5.0
    leverage_cap: null

  # source_verified_date: never — and this is the profile where that matters
  #   most. Its exposure ceiling of 12.5x is the ONLY one in the file and
  #   the sole reason LEVERAGE_LIMIT_EXCEEDED exists, so an unverified number
  #   here is an unverified refusal rule, not just an unverified margin rate.
  - name: finotive
    source: wladislav.com comparison table, FinotiveFunding row
    leverage:
      FX: 100.0
      INDEX: 10.0
      COMMODITY: 20.0        # metals; energy published at 1:20 as well
      CRYPTO: 2.0
      EQUITY: 5.0
    leverage_cap: 12.5
    notes: >-
      The only profile here carrying an explicit exposure ceiling: the row reads
      "Notional Volume Limit ... Max Exposure: $1,250,000 (for 100k account)",
      which is 12.5x equity. This is the rule the LEVERAGE_LIMIT_EXCEEDED
      refusal exists for, and it binds where margin alone does not.

  # source_verified_date: never — not read from PipFarm's own rulebook.
  - name: pipfarm
    source: wladislav.com comparison table, PipFarm 100k row
    leverage:
      FX: 30.0
      INDEX: 20.0
      COMMODITY: 20.0
      CRYPTO: 5.0
    leverage_cap: null
    notes: The same row states leverage rises with account XP; the base figure is recorded.

  # source_verified_date: never — not read from E8 Markets' own rulebook.
  - name: e8
    source: wladislav.com comparison table, E8 Markets row
    leverage:
      FX: 50.0
      INDEX: 50.0
      COMMODITY: 50.0
      CRYPTO: 5.0
    leverage_cap: null

  # source_verified_date: never — not read from Maven's own rulebook.
  - name: maven
    source: wladislav.com comparison table, Maven 100k row
    leverage:
      FX: 75.0
      INDEX: 20.0
      COMMODITY: 20.0
      CRYPTO: 2.0
    leverage_cap: null

  # source_verified_date: never — not read from RebelsFunding's own rulebook,
  #   and the challenge/funded split recorded below is itself a reading of the
  #   affiliate table rather than of the firm.
  - name: rebels_funded
    source: wladislav.com comparison table, RebelsFunding row, funded column
    leverage:
      FX: 50.0               # majors; the row publishes 25 for crosses, 25 for exotics
      INDEX: 15.0
      COMMODITY: 15.0
      CRYPTO: 2.5
      EQUITY: 2.5
    leverage_cap: null
    notes: >-
      The one firm here publishing different leverage before and after funding
      (majors 1:100 on challenge, 1:50 funded). The funded figures are recorded,
      being the ones a live account trades under.
