# Instrument contract specifications.
#
# Loaded by trading_system.core.instruments.load_instruments. Numbers here are
# representative retail-broker values, not a live feed: they are what a backtest
# assumes, and a live run should reconcile them against the broker's own symbol
# table before trusting a position size computed from them.
#
# tick_size vs point_size: tick_size is the smallest quotable increment,
# point_size is the unit distances are measured in. They differ for every
# instrument below except XAUUSD. See core/instruments.py for why they are two
# fields rather than one.
#
# Money fields (commission_per_lot, swap_long, swap_short) are in ACCOUNT
# currency. Everything derived from price (value_per_point_quote) is in the
# instrument's quote currency and needs converting; see risk/conversion.py.
#
# Every FX swap below comes from one rule, so that the file cannot hold two
# incompatible models of financing:
#
#   swap_long  = notional_usd * (r_base - r_quote - 0.90) / 100 / 365
#   swap_short = notional_usd * (r_quote - r_base - 0.90) / 100 / 365
#
# The 0.90%/yr markup is calibrated on the EURUSD figures this file already
# carried, which decompose to 0.86% and a EUR-minus-USD differential of -1.52%.
# Assumed policy rates, %/yr: USD 3.50, EUR 2.00, GBP 3.75, JPY 0.75, CHF 0.25,
# CAD 2.50, AUD 3.60, NZD 2.75. Those eight numbers are the ONLY input to check;
# the thirty swap figures are derived from them and are not independent
# evidence. Metals keep their own pair of numbers, decomposing to a 1.10%
# markup. Like everything here these are representative, not a broker's table.
#
# commission_basis is required on every entry and has no default. "7.00 per
# lot" is ambiguous between per-side and round-turn, the readings differ by
# exactly 2x, and a default would make one of them a silent assumption.
#
# margin_rate is the fraction of notional the VENUE requires, filled from the
# ESMA/FCA retail leverage limits: FX majors 1:30 (0.0333), FX non-majors 1:20
# (0.05), major indices and gold 1:20 (0.05), commodities other than gold 1:10
# (0.10), crypto 1:2 (0.5). A real published limit rather than one broker's
# marketing, so that a run naming no prop firm still refuses positions no
# regulated retail account could open.
#
# Those five tiers do NOT line up with InstrumentClass, which is why margin_rate
# is a field on the instrument and not a table keyed by asset class. ESMA splits
# FX by the composition of the pair — a major is any two of USD, EUR, JPY, GBP,
# CAD, CHF, so AUDUSD and NZDJPY sit at 1:20 while EURCAD and CHFJPY sit at 1:30
# — and it splits COMMODITY by the metal, gold at 1:20 against silver at 1:10.
# A prop profile overriding by class collapses both distinctions; see the note
# at the head of configs/prop_profiles.yaml for why that is correct rather than
# a defect.
#
# A prop firm's own leverage is a DIFFERENT and usually stricter figure, and it
# lives in configs/prop_profiles.yaml, which overrides this per asset class. The
# two are not duplicated here on purpose: this file says what the venue permits,
# that one says what the firm permits, and they disagree by design.

instruments:
