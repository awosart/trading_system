  - symbol: EURUSD
    asset_class: FX
    tick_size: 0.00001
    point_size: 0.0001        # one pip; 10 ticks on a five-digit feed
    lot_step: "0.01"
    min_lot: "0.01"
    max_lot: "100"
    contract_size: "100000"
    base_currency: EUR
    quote_currency: USD
    margin_rate: 0.0333       # 1:30, the ESMA retail limit for an FX major
    typical_spread_points: 0.8
    commission_per_lot: "7.00"
    commission_basis: ROUND_TURN   # 3.50 charged on each of the two fills
    swap_long: "-7.50"
    swap_short: "2.10"
    min_stop_distance_points: 1.0

